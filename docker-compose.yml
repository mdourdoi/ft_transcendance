services:
  vault-init:
    image: hashicorp/vault:1.18
    container_name: transcendance-vault-init
    entrypoint: ["sh", "/init.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
    volumes:
      - ./vault/tools/init.sh:/init.sh:ro
      - vault_keys:/vault/keys
      - ./vault/policies:/vault/policies:ro
      - vault_approle_backend:/vault/approle-backend
      - vault_approle_database:/vault/approle-database
    depends_on:
      vault:
        condition: service_healthy
    restart: "no"
    networks:
      - transcendance
    secrets:
      - env

  vault:
    image: hashicorp/vault:1.18
    container_name: transcendance-vault
    restart: unless-stopped
    command: server
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./vault/config:/vault/config:ro
      - vault_data:/vault/file
    networks:
      - transcendance
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200",
        ]
      interval: 2s
      timeout: 2s
      retries: 10

  waf:
    build: ./waf
    container_name: transcendance-waf
    restart: unless-stopped
    ports:
      - "8443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - transcendance

  db:
    image: postgres:16-alpine
    container_name: transcendance-db
    restart: unless-stopped
    entrypoint: ["sh", "/vault-entrypoint.sh"]
    command: ["postgres"]
    environment:
      VAULT_ADDR: http://vault:8200
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./vault/tools/db-entrypoint.sh:/vault-entrypoint.sh:ro
      - vault_approle_database:/vault/approle:ro
    depends_on:
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "transcendence"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transcendance

  redis:
    image: redis:7-alpine
    container_name: transcendance-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transcendance
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: transcendance-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: http://vault:8200
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
    ports:
      - "127.0.0.1:5555:5555"
    networks:
      - transcendance
    volumes:
      - avatars:/app/uploads/avatars
      - vault_approle_backend:/vault/approle:ro

  frontend:
    build: ./frontend
    container_name: transcendance-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - transcendance
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

volumes:
  db_data:
  avatars:
  redis_data:
  vault_keys:
  vault_data:
  vault_approle_backend:
  vault_approle_database:

networks:
  transcendance:
    driver: bridge

secrets:
  env:
    file: ./.env
